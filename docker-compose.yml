services:
  site:
    build: .
    container_name: yusufshoots
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - ./data:/data

  # --- Option A: Cloudflare Tunnel (recommended — no port forwarding, free HTTPS) ---
