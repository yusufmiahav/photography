<style>
:root{
  --cream:#F4EEE5; --paper:#FBF7F0; --paper-2:#E9E0D3; --paper-3:#DfD4C4;
  --ink:#24201B; --ink-soft:#534B40; --taupe:#8C8273; --sand:#C7B49A;
  --line:rgba(36,32,27,.13); --line-2:rgba(36,32,27,.07);
  --accent:#9B7C5C;
  --serif:"Cormorant Garamond",Georgia,serif;
  --sans:"Mulish",system-ui,sans-serif;
  --radius:2px;
  --maxw:1280px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;}
.scroll-root{height:100vh;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input{font-family:inherit;}
a{color:inherit;text-decoration:none;}
img{max-width:100%;}
h1,h2,h3,h4{margin:0;font-weight:400;}
p{margin:0;}
::selection{background:var(--ink);color:var(--cream);}

/* ---------- type ---------- */
.eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--taupe);font-weight:600;}
.eyebrow--light{color:rgba(255,255,255,.8);}
.display{font-family:var(--serif);font-weight:500;line-height:.98;letter-spacing:-.01em;font-size:clamp(44px,7vw,104px);}
.display--bleed{color:#fff;}
.display--center{font-size:clamp(80px,15vw,220px);letter-spacing:-.02em;}
.lede{font-size:clamp(16px,1.5vw,19px);line-height:1.6;color:var(--ink-soft);max-width:46ch;}
.muted{color:var(--taupe);} .tiny{font-size:12px;} .opt{color:var(--taupe);font-weight:400;text-transform:none;letter-spacing:0;font-size:11px;margin-left:6px;}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;
  padding:15px 26px;border-radius:var(--radius);transition:.25s ease;white-space:nowrap;}
.btn--dark{background:var(--ink);color:var(--cream);}
.btn--dark:hover{background:var(--accent);}
.btn--light{background:#fff;color:var(--ink);}
.btn--light:hover{background:var(--sand);}
.btn--ghost{border:1px solid var(--line);color:var(--ink);}
.btn--ghost:hover{background:var(--ink);color:var(--cream);border-color:var(--ink);}
.btn--ghost-light{border:1px solid rgba(255,255,255,.5);color:#fff;}
.btn--ghost-light:hover{background:#fff;color:var(--ink);}
.btn--lg{padding:18px 34px;}
.btn--full{width:100%;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn.is-busy{pointer-events:none;}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.link-arrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--ink);display:inline-flex;gap:.6em;align-items:center;}
.link-arrow span{transition:.25s;} .link-arrow:hover span{transform:translateX(5px);}

/* ---------- img + placeholder ---------- */
.img{background:var(--paper-2);}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:repeating-linear-gradient(135deg,var(--paper-2),var(--paper-2) 11px,var(--paper-3) 11px,var(--paper-3) 22px);}
.ph span{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.05em;color:var(--ink-soft);background:var(--cream);padding:5px 10px;border-radius:2px;}
.photo-btn{display:block;width:100%;height:100%;overflow:hidden;}
.photo-btn .img img{transition:transform .9s cubic-bezier(.2,.7,.2,1),filter .5s;}
.photo-btn:hover .img img{transform:scale(1.045);}

/* ---------- nav ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
  padding:22px clamp(20px,4vw,52px);transition:.35s ease;color:#fff;}
.nav--light{color:var(--ink);}
.nav--solid{background:rgba(244,238,229,.9);backdrop-filter:blur(14px);color:var(--ink);padding-top:15px;padding-bottom:15px;border-bottom:1px solid var(--line-2);}
.wordmark{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:.02em;line-height:1;}
.wordmark__dot{color:var(--accent);}
.wordmark--lg{font-size:40px;}
.nav__links{display:flex;align-items:center;gap:30px;}
.nav__link{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;opacity:.85;position:relative;padding:4px 0;}
.nav__link:hover{opacity:1;} .nav__link.is-active{opacity:1;}
.nav__link.is-active::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:currentColor;}
.nav__ig{font-size:12px;letter-spacing:.1em;font-weight:600;padding-left:30px;border-left:1px solid currentColor;opacity:.7;}
.nav__ig:hover{opacity:1;}
.nav__burger{display:none;flex-direction:column;gap:5px;padding:6px;}
.nav__burger span{width:24px;height:2px;background:currentColor;}
.nav__sheet{position:absolute;top:100%;right:clamp(20px,4vw,52px);background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;padding:10px;min-width:180px;box-shadow:0 20px 50px rgba(36,32,27,.16);}
.nav__sheet button,.nav__sheet a{text-align:left;padding:12px 14px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--ink);border-radius:2px;}
.nav__sheet button:hover,.nav__sheet a:hover{background:var(--cream);}

/* ---------- hero: full-bleed ---------- */
.hero--bleed{position:relative;height:100vh;min-height:620px;display:flex;flex-direction:column;justify-content:flex-end;padding:0 clamp(20px,5vw,72px) clamp(60px,9vh,110px);overflow:hidden;}
.hero__bg img{filter:brightness(.92);}
.hero__scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,17,14,.35) 0%,rgba(20,17,14,0) 35%,rgba(20,17,14,.55) 100%);}
.hero__bleed-inner{position:relative;max-width:900px;}
.hero__bleed-inner .display{margin:18px 0 30px;}
.hero__cta{display:flex;gap:14px;flex-wrap:wrap;}
.hero__cta--center{justify-content:center;}
.hero__scroll{position:absolute;right:clamp(20px,5vw,72px);bottom:36px;color:#fff;font-size:11px;letter-spacing:.2em;text-transform:uppercase;writing-mode:vertical-rl;opacity:.7;}

/* ---------- hero: editorial ---------- */
.hero--editorial{display:grid;grid-template-columns:1.05fr .92fr;gap:clamp(14px,2.2vw,38px);align-items:center;
  min-height:100vh;padding:128px clamp(20px,5vw,72px) 80px;max-width:var(--maxw);margin:0 auto;}
.hero__edcol .display{margin:20px 0 26px;font-size:clamp(40px,5vw,76px);}
.hero__edcol .hero__cta{margin-top:34px;}
.hero__edimg{position:relative;padding-bottom:13%;}
.hero__edimg>.img:first-child{width:80%;margin-left:auto;}
.hero__edimg .hero__edimg-2{position:absolute;left:-12%;bottom:0;width:52%;border:8px solid var(--cream);box-shadow:0 30px 60px rgba(36,32,27,.2);}

/* ---------- hero: centered ---------- */
.hero--centered{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:130px clamp(20px,5vw,52px) 60px;}
.hero--centered .display--center{margin:14px 0 6px;}
.hero__sub{font-family:var(--serif);font-style:italic;font-size:clamp(18px,2vw,26px);color:var(--ink-soft);margin-bottom:34px;}
.hero__strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;width:min(960px,92vw);margin-top:64px;}

/* ---------- sections ---------- */
.section{max-width:var(--maxw);margin:0 auto;padding:clamp(70px,10vw,140px) clamp(20px,5vw,52px);}
.intro__statement{font-family:var(--serif);font-size:clamp(26px,3.6vw,46px);line-height:1.28;font-weight:500;max-width:20ch;margin-top:26px;}
.intro__statement em{font-style:italic;color:var(--taupe);}
.section__head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:46px;flex-wrap:wrap;}
.section__title{font-family:var(--serif);font-size:clamp(30px,4vw,52px);font-weight:500;}
.featured__grid{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(12px,1.6vw,22px);}
.featured__cell{grid-column:span 2;}
.featured__cell--0{grid-column:span 4;}
.featured__cell--2{grid-row:span 1;}
.featured__cell .img{height:100%;}
.featured__cell--0 .img{aspect-ratio:16/10;}
.featured__cell--1 .img,.featured__cell--3 .img,.featured__cell--4 .img,.featured__cell--5 .img{aspect-ratio:4/5;}

.services{border-top:1px solid var(--line);}
.services__list{margin-top:30px;}
.services__row{display:grid;grid-template-columns:80px 1fr 1.4fr;gap:24px;align-items:baseline;padding:30px 0;border-bottom:1px solid var(--line);}
.services__n{font-family:var(--serif);font-size:22px;color:var(--accent);}
.services__row h3{font-family:var(--serif);font-size:clamp(22px,2.4vw,32px);font-weight:500;}
.services__row p{color:var(--ink-soft);line-height:1.6;font-size:15px;}

.quote{text-align:center;max-width:980px;}
.quote blockquote{font-family:var(--serif);font-style:italic;font-size:clamp(24px,3.2vw,40px);line-height:1.4;font-weight:500;margin:0;}
.quote cite{display:block;margin-top:26px;font-style:normal;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--taupe);font-weight:600;}

.cta{text-align:center;}
.cta__inner{background:var(--ink);color:var(--cream);border-radius:var(--radius);padding:clamp(54px,8vw,100px) 30px;}
.cta--tight .cta__inner{padding:clamp(44px,6vw,76px) 30px;}
.cta__title{font-family:var(--serif);font-size:clamp(30px,4.4vw,60px);font-weight:500;}
.cta__sub{color:rgba(244,238,229,.7);margin:18px auto 34px;max-width:44ch;line-height:1.6;}
.cta .btn--dark{background:var(--cream);color:var(--ink);}
.cta .btn--dark:hover{background:var(--sand);}

/* ---------- contact ---------- */
.contact{border-top:1px solid var(--line);}
.contact__grid{display:grid;grid-template-columns:1fr 1.1fr;gap:clamp(30px,5vw,80px);align-items:start;}
.contact__sub{color:var(--ink-soft);line-height:1.65;margin-top:18px;max-width:38ch;}
.contact__ways{margin-top:34px;display:flex;flex-direction:column;gap:18px;align-items:flex-start;}
.contact__phone{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:var(--radius);padding:18px 24px;transition:.25s;}
.contact__phone:hover{border-color:var(--ink);background:var(--paper);}
.contact__phlbl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--taupe);font-weight:600;}
.contact__phnum{font-family:var(--serif);font-size:clamp(24px,2.6vw,34px);font-weight:500;color:var(--ink);}
.contact__mail{font-size:15px;color:var(--ink-soft);border-bottom:1px solid var(--line);padding-bottom:2px;}
.contact__mail:hover{color:var(--ink);border-color:var(--ink);}
.contact__form{display:flex;flex-direction:column;gap:18px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(22px,3vw,34px);}
.contact__msg{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;font-size:15px;background:var(--cream);color:var(--ink);font-family:var(--sans);min-height:120px;resize:vertical;}
.contact__msg:focus{outline:none;border-color:var(--ink);background:#fff;}
.contact__fine{font-size:12px;color:var(--taupe);text-align:center;}
@media (max-width:900px){.contact__grid{grid-template-columns:1fr;}}
.contact__done{align-items:center;text-align:center;gap:14px;}
.contact__done h3{font-family:var(--serif);font-size:30px;font-weight:500;}
.contact__done p{color:var(--ink-soft);line-height:1.6;max-width:38ch;}
.contact__done .bk-done__seal{width:56px;height:56px;font-size:26px;margin:0 auto;}
.enq__msg{font-size:15px;color:var(--ink-soft);line-height:1.6;white-space:pre-wrap;}

/* ---------- footer ---------- */
.footer{background:var(--paper);border-top:1px solid var(--line);padding:clamp(54px,7vw,90px) clamp(20px,5vw,52px) 30px;}
.footer__top{max-width:var(--maxw);margin:0 auto;display:flex;justify-content:space-between;gap:40px;flex-wrap:wrap;padding-bottom:50px;border-bottom:1px solid var(--line);}
.footer__tag{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--ink-soft);margin-top:14px;max-width:30ch;}
.footer__cols{display:flex;gap:clamp(40px,7vw,100px);}
.footer__cols h4{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--taupe);margin-bottom:16px;font-weight:600;}
.footer__cols button,.footer__cols a,.footer__cols span{display:block;text-align:left;font-size:15px;color:var(--ink-soft);padding:5px 0;}
.footer__cols button:hover,.footer__cols a:hover{color:var(--ink);}
.footer__base{max-width:var(--maxw);margin:24px auto 0;display:flex;justify-content:space-between;font-size:12px;color:var(--taupe);flex-wrap:wrap;gap:10px;}

/* ---------- reveal ---------- */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1);}
.reveal.is-in{opacity:1;transform:none;}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none;}}

/* ---------- page scaffold ---------- */
.page{min-height:100vh;}
.page__head{max-width:var(--maxw);margin:0 auto;padding:140px clamp(20px,5vw,52px) 40px;}
.page__head--tight{padding-bottom:18px;}
.page__title{font-family:var(--serif);font-size:clamp(44px,7vw,96px);font-weight:500;line-height:1;margin-top:14px;}
.page__intro{max-width:50ch;margin-top:22px;color:var(--ink-soft);line-height:1.6;font-size:16px;}

/* ---------- portfolio ---------- */
.masonry{columns:3;column-gap:clamp(12px,1.6vw,22px);max-width:var(--maxw);margin:0 auto;padding:10px clamp(20px,5vw,52px) 40px;}
.masonry__item{break-inside:avoid;margin-bottom:clamp(12px,1.6vw,22px);position:relative;}
.masonry__cap{position:absolute;left:14px;bottom:14px;color:#fff;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;opacity:0;transform:translateY(6px);transition:.3s;text-shadow:0 1px 8px rgba(0,0,0,.5);}
.masonry__item:hover .masonry__cap{opacity:1;transform:none;}

.lb,.glb{position:fixed;inset:0;z-index:100;background:rgba(22,19,15,.94);display:flex;align-items:center;justify-content:center;padding:30px;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;}}
.lb__fig{margin:0;display:flex;flex-direction:column;align-items:center;gap:14px;}
.lb__fig figcaption{color:rgba(255,255,255,.65);font-size:12px;letter-spacing:.12em;text-transform:uppercase;}
.lb__close{position:absolute;top:24px;right:30px;color:#fff;font-size:34px;line-height:1;width:46px;height:46px;}
.lb__nav{color:#fff;font-size:48px;width:64px;height:64px;opacity:.7;flex:none;}
.lb__nav:hover{opacity:1;}

/* ---------- booking ---------- */
.stepper{max-width:var(--maxw);margin:0 auto;padding:6px clamp(20px,5vw,52px) 30px;display:flex;gap:6px;list-style:none;flex-wrap:wrap;}
.stepper__i{display:flex;align-items:center;gap:9px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--taupe);padding:8px 16px 8px 8px;border-radius:40px;}
.stepper__n{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;}
.stepper__i.is-now{color:var(--ink);} .stepper__i.is-now .stepper__n{background:var(--ink);color:var(--cream);border-color:var(--ink);}
.stepper__i.is-done .stepper__n{background:var(--accent);color:#fff;border-color:var(--accent);}
.bk-step{max-width:var(--maxw);margin:0 auto;padding:14px clamp(20px,5vw,52px) 100px;}

.pkgs{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.pkg{text-align:left;border:1px solid var(--line);border-radius:var(--radius);padding:30px 26px 26px;background:var(--paper);position:relative;transition:.25s;display:flex;flex-direction:column;}
.pkg:hover{border-color:var(--ink);} 
.pkg.is-sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink),0 24px 50px rgba(36,32,27,.1);}
.pkg--feat{background:#fff;}
.pkg__badge{position:absolute;top:-11px;left:26px;background:var(--accent);color:#fff;font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;padding:5px 12px;border-radius:30px;}
.pkg h3{font-family:var(--serif);font-size:30px;font-weight:500;}
.pkg__hours{color:var(--taupe);font-size:13px;margin-top:4px;}
.pkg__price{font-family:var(--serif);font-size:40px;margin:18px 0 6px;display:flex;align-items:baseline;gap:9px;}
.pkg__price em{font-family:var(--sans);font-style:normal;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe);font-weight:600;}
.pkg ul{list-style:none;padding:0;margin:16px 0 22px;display:flex;flex-direction:column;gap:10px;flex:1;}
.pkg li{font-size:14px;color:var(--ink-soft);padding-left:22px;position:relative;line-height:1.4;}
.pkg li::before{content:"—";position:absolute;left:0;color:var(--accent);}
.pkg__pick{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;border:1px solid var(--line);border-radius:2px;padding:12px;text-align:center;transition:.2s;}
.pkg.is-sel .pkg__pick{background:var(--ink);color:var(--cream);border-color:var(--ink);}

.bk-actions{display:flex;gap:14px;margin-top:34px;flex-wrap:wrap;}
.bk-actions--end{justify-content:flex-end;}
.bk-actions--center{justify-content:center;}
.bk-actions--stack{flex-direction:column;margin-top:24px;}
.bk-actions--stack .btn{width:100%;}

.bk-step--date{display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(30px,5vw,70px);align-items:start;}
.bk-date__side h3{font-family:var(--serif);font-size:30px;font-weight:500;margin-bottom:10px;}
.bk-date__chosen{margin-top:26px;padding:20px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);display:flex;flex-direction:column;gap:4px;}
.bk-date__chosen span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--taupe);font-weight:600;}
.bk-date__chosen b{font-family:var(--serif);font-size:26px;font-weight:500;}

/* calendar */
.cal{border:1px solid var(--line);border-radius:var(--radius);padding:22px;background:var(--paper);}
.cal__head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.cal__head span{font-family:var(--serif);font-size:22px;}
.cal__head button{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;font-size:18px;}
.cal__head button:hover{background:var(--cream);}
.cal__dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;}
.cal__dow span{text-align:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--taupe);font-weight:600;}
.cal__grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal__cell{aspect-ratio:1;border-radius:2px;font-size:15px;color:var(--ink);transition:.15s;position:relative;}
.cal__cell:not(:disabled):hover{background:var(--cream);}
.cal__cell--empty{pointer-events:none;}
.cal__cell.is-pref{font-weight:700;}
.cal__cell.is-pref::after{content:"";position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent);}
.cal__cell.is-booked{color:var(--taupe);text-decoration:line-through;opacity:.5;cursor:not-allowed;}
.cal__cell:disabled{color:rgba(36,32,27,.25);cursor:not-allowed;}
.cal__cell.is-selected{background:var(--ink)!important;color:var(--cream);}
.cal__cell.is-selected::after{background:var(--cream);}
.cal__legend{display:flex;gap:20px;margin-top:16px;font-size:12px;color:var(--taupe);}
.cal__legend span{display:flex;align-items:center;gap:7px;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.dot--pref{background:var(--accent);} .dot--booked{background:var(--taupe);}

.bk-step--form{display:grid;grid-template-columns:1.4fr 1fr;gap:clamp(30px,5vw,70px);align-items:start;}
.bk-form{display:flex;flex-direction:column;gap:20px;}
.fld{display:flex;flex-direction:column;gap:8px;}
.fld>span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe);font-weight:600;}
.fld input{border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;font-size:16px;background:var(--paper);color:var(--ink);transition:.2s;}
.fld input:focus{outline:none;border-color:var(--ink);background:#fff;}
.fld input.is-err{border-color:#b4533f;}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.fld__card{position:relative;}
.fld__card input{width:100%;padding-right:90px;}
.brand{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--taupe);font-style:normal;font-weight:700;}
.brand--on{color:var(--ink);}
.bk-recap,.pay__summary{border:1px solid var(--line);border-radius:var(--radius);padding:26px;background:var(--paper);position:sticky;top:90px;}
.bk-recap h4,.pay__summary h4{font-family:var(--serif);font-size:24px;font-weight:500;margin-bottom:18px;}
.sumrow{display:flex;justify-content:space-between;gap:14px;padding:9px 0;font-size:15px;}
.sumrow--muted{color:var(--taupe);font-size:13px;}
.sumrow--lg{font-size:18px;}
.sumrow--lg b{font-family:var(--serif);font-size:24px;font-weight:600;}
.bk-recap hr,.pay__summary hr,.invoice hr{border:none;border-top:1px solid var(--line);margin:10px 0;}

/* payment */
.pay{display:grid;grid-template-columns:1.3fr 1fr;gap:clamp(30px,5vw,60px);align-items:start;}
.pay__form{display:flex;flex-direction:column;gap:18px;}
.pay__lock{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;}
.pay__lock b{color:#635BFF;}
.lockico{font-size:14px;}
.pay__err{color:#b4533f;font-size:14px;}
.pay__fine{font-size:12px;color:var(--taupe);line-height:1.6;}
.pay__fine code{background:var(--paper-2);padding:2px 6px;border-radius:3px;font-size:11px;margin:0 4px;}
.pay__schedule{margin-top:20px;border-top:1px solid var(--line);padding-top:18px;}
.pay__schedule p{font-size:13px;margin-bottom:10px;}
.pay__schedule ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;}
.pay__schedule li{font-size:13px;color:var(--ink-soft);line-height:1.5;}

/* confirmation */
.bk-done{max-width:780px;text-align:center;}
.bk-done__seal{width:74px;height:74px;border-radius:50%;background:var(--accent);color:#fff;font-size:34px;display:grid;place-items:center;margin:0 auto 26px;animation:pop .5s cubic-bezier(.2,1.4,.5,1);}
@keyframes pop{from{transform:scale(0);opacity:0;}}
.bk-done h2{font-family:var(--serif);font-size:clamp(34px,5vw,56px);font-weight:500;}
.bk-done__lead{color:var(--ink-soft);line-height:1.6;margin:18px auto 36px;max-width:48ch;}
.invoice{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);text-align:left;padding:30px;margin:0 auto 36px;max-width:560px;}
.invoice__top{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:18px;}
.invoice__top .wordmark{font-size:26px;}
.invoice__status{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#2f7d4f;background:rgba(47,125,79,.12);padding:7px 13px;border-radius:30px;}
.invoice__note{font-size:12px;color:var(--taupe);line-height:1.6;margin-top:16px;}

/* ---------- client gallery ---------- */
.lock{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;}
.lock__bg img{filter:brightness(.55) saturate(.9);}
.lock__scrim{position:absolute;inset:0;background:rgba(22,19,15,.35);}
.lock__card{position:relative;background:var(--cream);border-radius:var(--radius);padding:46px clamp(28px,5vw,52px);width:min(440px,100%);box-shadow:0 40px 90px rgba(0,0,0,.4);text-align:center;}
.lock__title{font-family:var(--serif);font-size:clamp(38px,6vw,58px);font-weight:500;margin:12px 0 6px;line-height:1;}
.lock__meta{color:var(--taupe);font-size:14px;margin-bottom:30px;}
.fld--lock{text-align:left;margin-bottom:14px;}
.lock__err{color:#b4533f;font-size:13px;margin-bottom:12px;text-align:left;}
.lock__hint{font-size:12px;color:var(--taupe);margin-top:18px;}
.lock__hint code{background:var(--paper-2);padding:2px 7px;border-radius:3px;}

.cg__head{max-width:var(--maxw);margin:0 auto;padding:130px clamp(20px,5vw,52px) 30px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;border-bottom:1px solid var(--line);}
.cg__meta{color:var(--taupe);margin-top:14px;font-size:14px;}
.cg__tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.chip{border:1px solid var(--line);border-radius:40px;padding:12px 20px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--ink);transition:.2s;}
.chip:hover{border-color:var(--ink);} .chip.is-on{background:var(--accent);color:#fff;border-color:var(--accent);}
.cg__empty{max-width:var(--maxw);margin:40px auto;padding:0 clamp(20px,5vw,52px);color:var(--taupe);font-family:var(--serif);font-size:24px;font-style:italic;}
.cg__grid{max-width:var(--maxw);margin:0 auto;padding:30px clamp(20px,5vw,52px) 100px;display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(10px,1.4vw,18px);}
.cg__cell{position:relative;}
.cg__heart{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.85);backdrop-filter:blur(6px);font-size:18px;color:var(--ink);display:grid;place-items:center;opacity:0;transform:scale(.85);transition:.2s;}
.cg__cell:hover .cg__heart{opacity:1;transform:none;}
.cg__heart.is-on{opacity:1;transform:none;color:#c0445a;background:#fff;}
.cg__cellbar{position:absolute;left:12px;bottom:12px;display:flex;gap:8px;opacity:0;transition:.2s;}
.cg__cell:hover .cg__cellbar{opacity:1;}
.cg__dl{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.85);backdrop-filter:blur(6px);display:grid;place-items:center;font-size:16px;color:var(--ink);}
.cg__dl:hover{background:#fff;}
.cg__cc{background:rgba(255,255,255,.85);backdrop-filter:blur(6px);border-radius:30px;padding:0 14px;height:38px;display:flex;align-items:center;font-size:12px;font-weight:600;color:var(--ink);}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:15px 26px;border-radius:40px;font-size:14px;z-index:120;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:rise .3s ease;}
@keyframes rise{from{opacity:0;transform:transl(-50%,12px);}}

.glb{padding:0;}
.glb__stage{flex:1;display:flex;align-items:center;justify-content:center;padding:40px;min-width:0;}
.glb__side{width:380px;flex:none;background:var(--cream);height:100%;overflow-y:auto;padding:30px;display:flex;flex-direction:column;gap:20px;}
.glb__sidehead{display:flex;flex-direction:column;gap:14px;padding-bottom:18px;border-bottom:1px solid var(--line);}
.glb__acts{display:flex;gap:10px;flex-wrap:wrap;}
.iconbtn{border:1px solid var(--line);border-radius:40px;padding:11px 18px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:6px;transition:.2s;}
.iconbtn:hover{border-color:var(--ink);}
.iconbtn.is-fav{background:#fff;color:#c0445a;border-color:#e6b8c1;}
.glb__comments h4{font-family:var(--serif);font-size:22px;font-weight:500;margin-bottom:14px;}
.cmt{border-bottom:1px solid var(--line-2);padding:12px 0;}
.cmt__head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px;}
.cmt__head b{font-size:14px;} .cmt__head span{font-size:11px;color:var(--taupe);}
.cmt p{font-size:14px;color:var(--ink-soft);line-height:1.5;}
.cf{margin-top:16px;display:flex;flex-direction:column;gap:10px;}
.cf input{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;font-size:14px;background:var(--paper);color:var(--ink);}
.cf input:focus{outline:none;border-color:var(--ink);background:#fff;}
.cf__row{display:flex;gap:8px;}
.cf__text{flex:1;}
.cf__send{padding:12px 18px;flex:none;}

/* ---------- coverage selector ---------- */
.covsel{margin-bottom:30px;}
.covsel__lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe);font-weight:600;margin-bottom:12px;}
.covsel__row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.covsel__b{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);padding:16px 18px;text-align:left;display:flex;flex-direction:column;gap:3px;transition:.2s;}
.covsel__b:hover{border-color:var(--ink);}
.covsel__b.is-on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink);background:#fff;}
.covsel__b b{font-family:var(--serif);font-size:21px;font-weight:500;}
.covsel__b span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--taupe);font-weight:600;}
.covsel__b.is-on span{color:var(--accent);}

/* ---------- films ---------- */
.film-card{display:block;width:100%;text-align:left;}
.film-card__media{position:relative;overflow:hidden;border-radius:var(--radius);}
.film-card__media .img img{transition:transform .9s cubic-bezier(.2,.7,.2,1),filter .5s;filter:brightness(.92);}
.film-card:hover .film-card__media .img img{transform:scale(1.05);filter:brightness(.8);}
.film-card__scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,17,14,.05),rgba(20,17,14,.45));}
.film-card__play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;transition:.25s;}
.film-card--lg .film-card__play{width:78px;height:78px;}
.film-card:hover .film-card__play{transform:translate(-50%,-50%) scale(1.08);background:#fff;}
.film-card__play span{color:var(--ink);font-size:20px;margin-left:3px;}
.film-card__len{position:absolute;right:12px;bottom:12px;background:rgba(20,17,14,.7);color:#fff;font-size:11px;letter-spacing:.06em;font-weight:600;padding:4px 9px;border-radius:30px;backdrop-filter:blur(4px);}
.film-card__cap{padding:16px 2px 0;}
.film-card__cap h3{font-family:var(--serif);font-size:24px;font-weight:500;}
.film-card__cap p{color:var(--ink-soft);font-size:14px;margin-top:3px;}
.film-card__place{display:inline-block;margin-top:8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600;}

.films-teaser__grid{display:grid;grid-template-columns:1.5fr 1fr;gap:clamp(16px,2vw,26px);}
.films-teaser__col{display:flex;flex-direction:column;gap:clamp(16px,2vw,26px);}
.films__grid{max-width:var(--maxw);margin:0 auto;padding:10px clamp(20px,5vw,52px) 40px;display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(20px,3vw,40px);}

.film-lb{position:fixed;inset:0;z-index:100;background:rgba(16,13,10,.96);display:flex;align-items:center;justify-content:center;padding:30px;animation:fade .25s ease;}
.film-lb__frame{width:min(1100px,94vw);}
.film-lb__video{position:relative;aspect-ratio:16/9;background:#000;border-radius:var(--radius);overflow:hidden;}
.film-lb__poster img{filter:brightness(.7);animation:kb 14s ease-in-out infinite alternate;}
@keyframes kb{from{transform:scale(1);}to{transform:scale(1.08);}}
.film-lb__scrim{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(0,0,0,.1),rgba(0,0,0,.5));}
.film-lb__play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;}
.film-lb__play span{color:var(--ink);font-size:28px;margin-left:4px;}
.film-lb__note{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:rgba(255,255,255,.75);font-size:12px;letter-spacing:.1em;text-transform:uppercase;}
.film-lb__meta{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-top:20px;flex-wrap:wrap;}
.film-lb__meta h3{font-family:var(--serif);font-size:30px;font-weight:500;color:#fff;}
.film-lb__meta .muted{color:rgba(255,255,255,.6);margin-top:4px;}
.film-lb__tags{display:flex;gap:10px;}
.film-lb__tags span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:30px;padding:7px 14px;font-weight:600;}
.film-lb__yt{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:transparent;border:1px solid rgba(255,255,255,.3);border-radius:30px;padding:7px 14px;font-weight:600;white-space:nowrap;outline:none;-webkit-tap-highlight-color:transparent;}
.film-lb__yt:hover,.film-lb__yt:focus,.film-lb__yt:active{background:#fff;color:#000;border-color:#fff;}

.pkg__price em{font-family:var(--sans);font-style:normal;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe);font-weight:600;}
.pkgs--2{grid-template-columns:repeat(2,1fr);max-width:760px;margin-left:auto;margin-right:auto;}
.btn--sm{padding:10px 16px;font-size:11px;}
.pkg-incl{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;}
.pkg-incl li{font-size:14px;color:var(--ink-soft);padding-left:22px;position:relative;line-height:1.4;}
.pkg-incl li::before{content:"—";position:absolute;left:0;color:var(--accent);}

/* quote request */
.quote-req{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);padding:30px;}
.quote-req h3{font-family:var(--serif);font-size:28px;font-weight:500;margin-bottom:12px;}
.quote-req .muted{line-height:1.6;font-size:15px;}
.quote-req__list{list-style:none;padding:0;margin:22px 0;display:flex;flex-direction:column;gap:12px;}
.quote-req__list li{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line-2);}
.quote-req__list span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe);font-weight:600;}
.quote-req__list b{font-family:var(--serif);font-size:18px;font-weight:500;}
.invoice__status--pending{color:#9b6b1e;background:rgba(155,107,30,.12);}

/* hidden studio hotspot */
.footer__base{position:relative;}
.footer__hot{position:absolute;right:-12px;bottom:-12px;width:46px;height:46px;opacity:0;cursor:default;}

/* ---------- studio admin ---------- */
.admin{min-height:100vh;background:var(--cream);}
.admin__bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:16px clamp(20px,4vw,52px);background:var(--ink);color:var(--cream);}
.admin__brand{display:flex;align-items:center;gap:14px;}
.admin__brand .wordmark{color:var(--cream);font-size:24px;}
.admin__tag{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--sand);border:1px solid rgba(244,238,229,.3);padding:4px 10px;border-radius:30px;}
.admin__baracts{display:flex;gap:10px;}
.admin__wrap{max-width:1180px;margin:0 auto;padding:40px clamp(20px,5vw,52px) 100px;}
.admin__head{margin-bottom:34px;}
.admin__head h1{font-family:var(--serif);font-size:clamp(32px,4vw,48px);font-weight:500;}
.admin__head .muted{margin-top:8px;max-width:60ch;line-height:1.6;}
.admin__grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px;}
.agcard{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);overflow:hidden;}
.agcard__cover{position:relative;aspect-ratio:4/3;background:var(--paper-2);}
.agcard__cover img{width:100%;height:100%;object-fit:cover;display:block;}
.agcard__cover .ph{position:absolute;inset:0;}
.agcard__count{position:absolute;left:12px;bottom:12px;background:rgba(20,17,14,.7);color:#fff;font-size:11px;font-weight:600;padding:4px 10px;border-radius:30px;backdrop-filter:blur(4px);}
.agcard__sample{position:absolute;right:12px;top:12px;background:var(--sand);color:var(--ink);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:4px 10px;border-radius:30px;}
.agcard__body{padding:18px 20px 20px;}
.agcard__body h3{font-family:var(--serif);font-size:24px;font-weight:500;}
.agcard__pw{margin:12px 0 16px;font-size:13px;color:var(--ink-soft);}
.agcard__pw code{background:var(--paper-2);padding:3px 8px;border-radius:3px;}
.agcard__acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.iconbtn--sm{padding:9px 13px;font-size:11px;}
.iconbtn:disabled{opacity:.4;cursor:not-allowed;}

.admin__edit{display:grid;grid-template-columns:1.5fr 1fr;gap:clamp(24px,4vw,50px);align-items:start;}
.admin__form h2{font-family:var(--serif);font-size:32px;font-weight:500;margin-bottom:22px;}
.admin__form>.fld,.admin__form>.fld-row{margin-bottom:18px;}
.admin__upload{margin:24px 0;}
.admin__uploadhead{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px;}
.admin__uploadhead>span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe);font-weight:600;}
.admin__drop{border:1.5px dashed var(--line);border-radius:var(--radius);padding:22px;background:var(--paper);min-height:120px;display:flex;align-items:center;justify-content:center;}
.admin__drop .muted{text-align:center;max-width:44ch;line-height:1.6;}
.admin__thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;width:100%;}
.athumb{position:relative;aspect-ratio:1;border-radius:2px;overflow:hidden;border:2px solid transparent;}
.athumb.is-cover{border-color:var(--accent);}
.athumb img{width:100%;height:100%;object-fit:cover;display:block;}
.athumb__x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(20,17,14,.75);color:#fff;font-size:16px;line-height:1;display:grid;place-items:center;}
.athumb__cover{position:absolute;left:0;right:0;bottom:0;background:rgba(20,17,14,.7);color:#fff;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding:5px;opacity:0;transition:.2s;}
.athumb:hover .athumb__cover,.athumb.is-cover .athumb__cover{opacity:1;}
.athumb.is-cover .athumb__cover{background:var(--accent);}
.admin__preview{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);padding:24px;position:sticky;top:90px;}
.admin__preview h4{font-family:var(--serif);font-size:22px;font-weight:500;margin-bottom:16px;}
.admin__pvcard{border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);}
.admin__pvcard img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;}
.admin__pvcard .ph{position:relative;aspect-ratio:4/3;}
.admin__pvmeta{padding:14px 16px;display:flex;flex-direction:column;gap:3px;}
.admin__pvmeta b{font-family:var(--serif);font-size:20px;font-weight:500;}
.admin__pvmeta span{font-size:13px;color:var(--taupe);}
.admin__pvlink{margin-top:18px;display:flex;flex-direction:column;gap:6px;}
.admin__pvlink code{background:var(--paper-2);padding:8px 10px;border-radius:3px;font-size:12px;word-break:break-all;}
.cg__exit{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--taupe);font-weight:600;margin-bottom:14px;}
.cg__exit:hover{color:var(--ink);}
.admin__loginwrap{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.admin__login{width:min(400px,100%);background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:36px;display:flex;flex-direction:column;gap:16px;}
.admin__login h2{font-family:var(--serif);font-size:32px;font-weight:500;}
.pay__redirect{font-size:14px;color:var(--ink-soft);line-height:1.6;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
/* studio tabs + website editor */
.admin__tabs{display:flex;gap:6px;}
.admin__tab{color:rgba(244,238,229,.6);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding:8px 14px;border-radius:30px;transition:.2s;}
.admin__tab:hover{color:#fff;}
.admin__tab.is-on{color:var(--ink);background:var(--cream);}
.site-sec{border-top:1px solid var(--line);padding:30px 0;}
.site-sec>h2{font-family:var(--serif);font-size:28px;font-weight:500;}
.site-blockcount{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--ink);background:var(--paper-2);padding:7px 14px;border-radius:30px;white-space:nowrap;}
.cal--admin{max-width:440px;margin-top:6px;}
.cal--admin .cal__cell{cursor:pointer;}
.cal--admin .cal__cell.is-booked{background:var(--accent);color:#fff;text-decoration:none;opacity:1;cursor:pointer;}
.cal--admin .cal__cell.is-booked::after{display:none;}
.cal--admin .cal__cell.is-booked:hover{filter:brightness(1.08);}
.cal--admin .cal__cell.is-soon{color:rgba(36,32,27,.25);background:repeating-linear-gradient(135deg,transparent,transparent 4px,var(--line-2) 4px,var(--line-2) 8px);cursor:not-allowed;}
.cal__legnote{color:var(--taupe);font-size:11px;}
.disc-list{display:flex;flex-direction:column;gap:12px;}
.disc-row{display:grid;grid-template-columns:1.4fr .9fr .8fr .8fr auto auto;gap:12px;align-items:end;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);padding:14px;}
.disc-row .fld{gap:6px;}
.disc-row select{border:1px solid var(--line);border-radius:var(--radius);padding:13px 12px;font-size:15px;background:var(--paper);color:var(--ink);}
.disc-row select:focus{outline:none;border-color:var(--ink);background:#fff;}
.disc-uses{display:flex;flex-direction:column;gap:6px;}
.disc-uses span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe);font-weight:600;}
.disc-uses b{font-family:var(--serif);font-size:20px;font-weight:500;}
.disc-del{color:#b4533f;border-color:#e2bcb2;height:max-content;}
@media (max-width:760px){.disc-row{grid-template-columns:1fr 1fr;}}
.pay__promo{margin:14px 0;}
.promo-row{display:flex;gap:8px;}
.promo-row input{flex:1;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;font-size:14px;background:var(--paper);color:var(--ink);text-transform:uppercase;letter-spacing:.06em;}
.promo-row input:focus{outline:none;border-color:var(--ink);background:#fff;}
.promo-applied{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(47,125,79,.1);border:1px solid rgba(47,125,79,.3);border-radius:var(--radius);padding:11px 14px;font-size:13px;}
.promo-applied button{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:#b4533f;}
.promo-err{color:#b4533f;font-size:12px;margin-top:8px;}
.sumrow--disc,.sumrow--disc b{color:#2f7d4f;}
/* pay mode picker */
.paymode{display:flex;flex-direction:column;gap:8px;margin:4px 0 12px;}
.paymode__lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe);font-weight:600;margin-bottom:2px;}
.paymode__opt{display:flex;align-items:flex-start;gap:11px;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:.2s;background:var(--cream);}
.paymode__opt:hover{border-color:var(--ink);}
.paymode__opt.is-on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink);background:#fff;}
.paymode__opt input{position:absolute;opacity:0;pointer-events:none;}
.paymode__box{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--taupe);flex:none;margin-top:2px;display:grid;place-items:center;}
.paymode__opt.is-on .paymode__box{border-color:var(--ink);}
.paymode__opt.is-on .paymode__box::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink);}
.paymode__txt{display:flex;flex-direction:column;gap:2px;}
.paymode__txt b{font-size:14px;font-weight:600;}
.paymode__txt em{font-style:normal;font-size:12px;color:var(--taupe);}
.bk-list{display:flex;flex-direction:column;gap:16px;}
.bk-subhead{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--taupe);font-weight:600;margin:30px 0 14px;}
.bkrec{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);padding:20px 22px;}
.bkrec__head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--line-2);margin-bottom:14px;}
.bkrec__head h3{font-family:var(--serif);font-size:24px;font-weight:500;}
.bkrec__status{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:5px 12px;border-radius:30px;white-space:nowrap;}
.bkrec__status--confirmed{color:#2f7d4f;background:rgba(47,125,79,.12);}
.bkrec__status--refunded{color:#9b6b1e;background:rgba(155,107,30,.12);}
.bkrec__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.bkrec__grid>div{display:flex;flex-direction:column;gap:3px;}
.bkrec__grid span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--taupe);font-weight:600;}
.bkrec__grid b{font-size:14px;font-weight:500;}
.bkrec__acts{margin-top:16px;display:flex;justify-content:flex-end;}
.bkrec__refund{color:#b4533f;border-color:#e2bcb2;}
.bkrec__refnote{margin-top:14px;font-size:12px;color:var(--taupe);text-align:right;}
@media(max-width:700px){.bkrec__grid{grid-template-columns:1fr 1fr;}}
.bkrec__wide{grid-column:1/-1;}
.bkrec__notes{margin-top:14px;border-top:1px solid var(--line-2);padding-top:12px;}
.bkrec__notes span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--taupe);font-weight:600;}
.bkrec__notes p{margin-top:5px;font-size:14px;color:var(--ink-soft);line-height:1.5;white-space:pre-wrap;}
.bkrec__files{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;}
.bkfile{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--radius);background:var(--cream);padding:8px 12px;font-size:13px;}
.bkfile--ro:hover{border-color:var(--ink);}
.bkfile__ic{font-size:14px;}
.bkfile__name{color:var(--ink);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bkfile__size{color:var(--taupe);font-size:11px;}
.bkfile__x{width:22px;height:22px;border-radius:50%;background:var(--paper-2);color:var(--ink);font-size:15px;line-height:1;display:grid;place-items:center;}
.bkrec--edit{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink);}
.bkedit__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px;}
.bkedit__grid .fld,.bkrec--edit>.fld{margin-bottom:16px;}
.bkedit__notes{border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;font-size:15px;background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:90px;resize:vertical;}
.bkedit__notes:focus{outline:none;border-color:var(--ink);background:#fff;}
.bkedit__assets{margin:6px 0 4px;border-top:1px solid var(--line-2);padding-top:16px;}
.bkedit__assetshead{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px;}
.bkedit__assetshead>span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe);font-weight:600;}
.bkedit__files{display:flex;flex-direction:column;gap:8px;}
@media(max-width:700px){.bkedit__grid{grid-template-columns:1fr 1fr;}}
.admin__headrow{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.bkman{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:start;}
.bkman__chosen{margin-top:12px;font-size:13px;color:var(--taupe);}
.bkman__chosen b{font-family:var(--serif);font-size:18px;color:var(--ink);font-weight:500;margin-left:6px;}
.bkman__form .fld{margin-bottom:0;}
@media(max-width:860px){.bkman{grid-template-columns:1fr;}}
.site-sechead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
.site-sechead h2{font-family:var(--serif);font-size:28px;font-weight:500;}
.site-hero{display:flex;align-items:center;gap:20px;margin-top:16px;flex-wrap:wrap;}
.site-hero img{width:240px;aspect-ratio:3/2;object-fit:cover;border-radius:var(--radius);border:1px solid var(--line);}
.site-films{display:flex;flex-direction:column;gap:18px;}
.admin__thumbs--cap{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
.athumb--cap{aspect-ratio:auto;display:flex;flex-direction:column;border:1px solid var(--line);}
.athumb--cap img{aspect-ratio:1;}
.athumb__cap{border:none;border-top:1px solid var(--line);background:var(--paper);padding:9px 10px;font-size:12px;color:var(--ink);width:100%;}
.athumb__cap:focus{outline:none;background:#fff;}
.athumb__cap::placeholder{color:var(--taupe);}
.site-film{display:grid;grid-template-columns:200px 1fr;gap:22px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);padding:18px;}
.site-film__poster{display:flex;flex-direction:column;gap:10px;}
.site-film__poster img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:2px;}
.site-film__fields{display:flex;flex-direction:column;gap:14px;}
.site-film__del{align-self:flex-start;color:#b4533f;border-color:#e2bcb2;}
.site-film__vtag{display:flex;align-items:center;gap:6px;justify-content:center;font-size:11px;letter-spacing:.04em;color:var(--taupe);background:var(--paper-2);border-radius:30px;padding:5px 10px;font-weight:600;}
.site-film__vtag.is-file{color:#2f7d4f;background:rgba(47,125,79,.12);}
.site-film__vtag button{width:16px;height:16px;border-radius:50%;background:rgba(36,32,27,.15);color:var(--ink);font-size:12px;line-height:1;display:grid;place-items:center;flex:none;}
@media (max-width:700px){.site-film{grid-template-columns:1fr;}.site-film__poster img{aspect-ratio:2/1;}}
.cg__exit--site{margin-left:18px;}
/* gallery index (find your gallery) */
.gx__head{max-width:var(--maxw);margin:0 auto;padding:48px clamp(20px,5vw,52px) 30px;}
.gx__home{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--taupe);font-weight:600;margin-bottom:20px;}
.gx__home:hover{color:var(--ink);}
.gx__grid{max-width:var(--maxw);margin:0 auto;padding:20px clamp(20px,5vw,52px) 100px;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(18px,2.5vw,34px);}
.gx-card{display:block;text-align:left;}
.gx-card__cover{position:relative;overflow:hidden;border-radius:var(--radius);}
.gx-card__img img{filter:blur(14px) brightness(.82) saturate(1.05);transform:scale(1.18);transition:transform .8s ease;}
.gx-card:hover .gx-card__img img{transform:scale(1.24);}
.gx-card__scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,17,14,.15),rgba(20,17,14,.45));}
.gx-card__lock{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.85);backdrop-filter:blur(4px);display:grid;place-items:center;font-size:20px;transition:.25s;}
.gx-card:hover .gx-card__lock{background:#fff;transform:translate(-50%,-50%) scale(1.08);}
.gx-card__meta{padding:18px 4px 0;}
.gx-card__meta h3{font-family:var(--serif);font-size:27px;font-weight:500;}
.gx-card__meta span{display:block;color:var(--taupe);font-size:13px;margin-top:4px;}
.gx-card__meta em{display:inline-block;margin-top:12px;font-style:normal;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;}
.lock__home{position:absolute;top:24px;left:clamp(20px,4vw,40px);z-index:3;color:#fff;font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:.02em;}
.lock__back{display:block;margin:16px auto 0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--taupe);font-weight:600;}
.lock__back:hover{color:var(--ink);}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .admin__edit{grid-template-columns:1fr;}
  .admin__preview{position:static;}
  .pkgs--2{grid-template-columns:1fr;max-width:520px;}
  .nav__links{display:none;} .nav__burger{display:flex;}
  .hero--editorial{grid-template-columns:1fr;}
  .hero__edimg{margin-top:20px;max-width:520px;}
  .featured__cell,.featured__cell--0{grid-column:span 3;}
  .featured__grid{grid-template-columns:repeat(6,1fr);}
  .bk-step--date,.bk-step--form,.pay{grid-template-columns:1fr;}
  .bk-recap,.pay__summary{position:static;}
  .pkgs{grid-template-columns:1fr;}
  .covsel__row{grid-template-columns:1fr;}
  .films-teaser__grid{grid-template-columns:1fr;}
  .films__grid{grid-template-columns:1fr;}
  .masonry{columns:2;}
  .cg__grid{grid-template-columns:repeat(3,1fr);}
  .gx__grid{grid-template-columns:repeat(2,1fr);}
  .glb{flex-direction:column;} .glb__side{width:100%;height:auto;max-height:42vh;}
  .glb__stage{padding:20px;min-height:46vh;}
  .services__row{grid-template-columns:50px 1fr;row-gap:8px;}
  .services__row p{grid-column:2;}
}
@media (max-width:560px){
  .hero__strip{grid-template-columns:repeat(2,1fr);}
  .masonry{columns:1;}
  .cg__grid{grid-template-columns:repeat(2,1fr);}
  .gx__grid{grid-template-columns:1fr;}
  .footer__top{flex-direction:column;}
  .stepper__i{padding:6px 10px 6px 6px;font-size:10px;}
}
</style>
</head>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

// Downscale an uploaded file to a storable JPEG data URL.
function fileToDataURL(file, max = 1600, q = 0.82) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let w = img.width, h = img.height;
      const scale = Math.min(1, max / Math.max(w, h));
      w = Math.round(w * scale); h = Math.round(h * scale);
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
    img.src = url;
  });
}

// Scroll-triggered reveal
function Reveal({ children, delay = 0, as: Tag = "div", className, style }) {
  const ref = useRef(null);
  const [vis, setVis] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) { setVis(true); io.disconnect(); } },
      { threshold: 0.12 }
    );
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return (
    <Tag ref={ref} className={"reveal " + (vis ? "is-in " : "") + (className || "")}
         style={{ transitionDelay: vis ? delay + "ms" : "0ms", ...style }}>
      {children}
    </Tag>
  );
}

// films.jsx — videography examples: Films page + homepage teaser + film lightbox.
const { useState: useStateF, useEffect: useEffectF } = React;

// Resolve a pasted link into a playable embed.
// YouTube/Vimeo → iframe; direct .mp4/.webm → <video>.
function videoEmbed(url) {
  if (!url) return null;
  const u = url.trim();
  let m;
  if ((m = u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/)))
    return { type: "iframe", src: `https://www.youtube-nocookie.com/embed/${m[1]}?autoplay=1&rel=0&playsinline=1`, page: `https://youtu.be/${m[1]}` };
  if ((m = u.match(/vimeo\.com\/(?:video\/)?(\d+)/)))
    return { type: "iframe", src: `https://player.vimeo.com/video/${m[1]}?autoplay=1`, page: `https://vimeo.com/${m[1]}` };
  if (/\.(mp4|webm|ogg|mov)(\?.*)?$/i.test(u) || u.startsWith("data:video"))
    return { type: "video", src: u };
  // Fallback: assume it's an embeddable URL
  return { type: "iframe", src: u, page: u };
}

// booking.jsx — multi-step booking + Stripe-style checkout.
// 1 Coverage + Package → 2 Date → 3 Details → 4 Payment / Request → 5 Confirmation.
const { useState: useStateB, useEffect: useEffectB, useMemo } = React;

const money = (n) => "£" + n.toLocaleString("en-GB");
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function Calendar({ value, onPick }) {
  const blocked = useMemo(() => new Set((loadSite().blocked) || []), []);
  const minDate = useMemo(() => earliestBookable(), []);
  const [view, setView] = useStateB({ y: 2026, m: 6 });
  const first = new Date(view.y, view.m, 1);
  const startDay = (first.getDay() + 6) % 7;
  const days = new Date(view.y, view.m + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startDay; i++) cells.push(null);
  for (let d = 1; d <= days; d++) cells.push(d);
  const key = (d) => `${view.y}-${view.m}-${d}`;
  const move = (dir) => setView((v) => {
    let m = v.m + dir, y = v.y;
    if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
    return { y, m };
  });
  return (
    <div className="cal">
      <div className="cal__head">
        <button onClick={() => move(-1)} aria-label="Previous month">‹</button>
        <span>{MONTHS[view.m]} {view.y}</span>
        <button onClick={() => move(1)} aria-label="Next month">›</button>
      </div>
      <div className="cal__dow">{["Mo","Tu","We","Th","Fr","Sa","Su"].map((d) => <span key={d}>{d}</span>)}</div>
      <div className="cal__grid">
        {cells.map((d, i) => {
          if (!d) return <span key={i} className="cal__cell cal__cell--empty" />;
          const k = key(d);
          const date = new Date(view.y, view.m, d);
          const tooSoon = date < minDate;
          const booked = blocked.has(k);
          const sat = date.getDay() === 6;
          const disabled = tooSoon || booked;
          const selected = value === k;
          return (
            <button key={i}
              className={"cal__cell" + (selected ? " is-selected" : "") + (sat && !disabled ? " is-pref" : "") + (booked ? " is-booked" : "")}
              disabled={disabled}
              onClick={() => onPick(k, `${d} ${MONTHS[view.m]} ${view.y}`)}
              title={booked ? "Already booked" : tooSoon ? "Too soon — book at least " + MIN_LEAD_DAYS + " days ahead" : sat ? "Saturday — prime date" : ""}>
              {d}
            </button>
          );
        })}
      </div>
      <div className="cal__legend">
        <span><i className="dot dot--pref" /> Saturday</span>
        <span><i className="dot dot--booked" /> Booked</span>
        <span className="cal__legnote">Min. {MIN_LEAD_DAYS} days' notice</span>
      </div>
    </div>
  );
}

const fmtExp = (v) => { const d = v.replace(/\D/g, "").slice(0, 4); return d.length > 2 ? d.slice(0, 2) + " / " + d.slice(2) : d; };
